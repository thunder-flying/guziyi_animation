  <!-- Letter G -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">G</text>
  
  <!-- Animation Symbol - small sparkle -->
  <g transform="translate(22, 10)">
